schemas:
  - name: static_schema
    database: static_database

shares:
  - name: static_share

stages:
  - name: static_stage
    type: INTERNAL
    directory:
      enable: true
    database: static_database
    schema: public

streams:
  - name: static_stream
    database: static_database
    schema: public
    on_table: static_database.public.static_table
    copy_grants: false

tables:
  - name: static_table
    columns:
      - name: id
        data_type: NUMBER(38,0)
    change_tracking: true
    database: static_database
    schema: public

tasks:
  - name: static_task_serverless
    database: static_database
    schema: public
    schedule: "1440 MINUTE"
    user_task_managed_initial_warehouse_size: XSMALL
    config: '{"some_key": "some_value"}'
    suspend_task_after_num_failures: 3
    allow_overlapping_execution: false
    state: STARTED
    as_: SELECT 1
  - name: static_task
    database: static_database
    schema: public
    schedule: "1440 MINUTE"
    warehouse: static_warehouse
    config: '{"some_key": "some_value"}'
    suspend_task_after_num_failures: 3
    allow_overlapping_execution: false
    state: STARTED
    as_: SELECT 1

views:
  # `as_` and `comment` must match tests/fixtures/static_resources/static_resources.yml
  # byte-for-byte (including case): any drift makes snowcap emit an ALTER VIEW that
  # Snowflake rejects.
  - name: static_view
    columns:
      - name: id
        data_type: NUMBER(38,0)
    as_: SELECT ID FROM STATIC_DATABASE.PUBLIC.STATIC_TABLE
    comment: View for integration tests
    change_tracking: true
    requires:
      - name: static_table
        resource_type: table
    database: static_database
    schema: public

warehouses:
  - name: static_warehouse
    warehouse_size: XSMALL
    auto_suspend: 30
    auto_resume: true
    initially_suspended: true
  - name: CI
    warehouse_size: XSMALL
    auto_suspend: 30
    initially_suspended: true


  
security_integrations:
  - name: STATIC_SECURITY_INTEGRATION
    type: api_authentication
    auth_type: OAUTH2
    oauth_client_auth_method: CLIENT_SECRET_POST
    oauth_client_id: 'sn-oauth-134o9erqfedlc'
    oauth_client_secret: 'eb9vaXsrcEvrFdfcvCaoijhilj4fc'
    oauth_token_endpoint: 'https://myinstance.service-now.com/oauth_token.do'
    enabled: true

external_volumes:
  - name: static_external_volume
    allow_writes: true
    storage_locations:
      - name: us-west-2
        storage_provider: S3
        storage_base_url: "{{ var.storage_base_url }}"
        storage_aws_role_arn: "{{ var.storage_role_arn }}"
        storage_aws_external_id: iceberg_table_external_id

secrets:
  - name: static_secret
    secret_type: PASSWORD
    username: someuser
    password: somepass
    database: static_database
    schema: public

