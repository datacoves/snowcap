[tool.black]
line-length = 120
target-version = ['py310']
include = '\.pyi?$'
# Black's defaults already cover .venv; the alternates below are common local venv and
# build directory names that `make style` would otherwise walk into.
extend-exclude = '''
/(
    \.venv[^/]*
  | build
  | dist
  | site
)/
'''

[tool.pyright]
pythonVersion = '3.10'
venvPath = ''
venv = ''

[tool.ruff]
line-length = 120

[tool.pytest.ini_options]
addopts = "-n 48 --dist loadfile"
markers = [
    "requires_snowflake: Mark a test as requiring a Snowflake connection.",
    "enterprise: Mark a test that only works on Enterprise Edition Snowflake.",
    "standard: Mark a test that works on Standard Edition Snowflake.",
    "slow: Mark a test that is slow to run but should still be executed.",
]
filterwarnings = [
    "ignore:.*urllib3.contrib.pyopenssl.*:DeprecationWarning"
]

[tool.codespell]
# codespell reads these as comma-separated strings; a TOML array is silently ignored.
# "objec" and "selct" are deliberately malformed identifiers in parser and error-handling
# tests, and "unparseable" is an accepted variant spelling.
ignore-words-list = "priv,sproc,snowpark,pathspec,objec,selct,unparseable"
skip = "./build/,./dist/,./site/,./.git/,./.venv/,./.venv-test/,./*.egg-info/"