[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "snowcap"
description = "Snowcap: Snowflake infrastructure as code"
readme = "README.md"
authors = [{ name = "Datacoves" }]
requires-python = ">=3.10"
# The version is managed by the string inside version.md; the bump-version
# workflow rewrites that file on release.
dynamic = ["version"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: Apache Software License",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: SQL",
    "Topic :: Database",
]
dependencies = [
    "rich-click==1.8.9",
    "click<8.2",
    "inflection==0.5.1",
    "pyparsing==3.0.9",
    "pyyaml",
    "snowflake-connector-python>=3.12.3",
    "snowflake-snowpark-python>=1.24.0",
    "pyOpenSSL>=22.1.0",
    "jinja2",
    "pathspec",
]

[project.urls]
Homepage = "https://github.com/datacoves/snowcap"

[project.scripts]
snowcap = "snowcap.cli:snowcap_cli"

[dependency-groups]
dev = [
    # Pinned: black's formatting changes between releases, and an unpinned
    # version means `make style` reformats files no one touched.
    "black==26.5.1",
    "build",
    "codespell==2.2.6",
    "cryptography",
    "mypy",
    "pytest-cov",
    "pytest-profiling!=1.8.0",
    "pytest-xdist",
    "pytest>=6.0",
    "python-dotenv",
    # ruff 0.16 changed the default rule selection and fails the codebase with 700+ new findings
    "ruff<0.16",
    "tabulate",
    "twine!=5.1.0",
    "types-pytz",
    "types-pyyaml",
]

[tool.hatch.version]
path = "version.md"
pattern = '# version (?P<version>\S+)'

[tool.hatch.build.targets.wheel]
packages = ["snowcap"]

[tool.black]
line-length = 120
target-version = ['py310']
include = '\.pyi?$'
# Black's defaults already cover .venv; the alternates below are common local venv and
# build directory names that `make style` would otherwise walk into.
extend-exclude = '''
/(
    \.venv[^/]*
  | build
  | dist
  | site
)/
'''

[tool.pyright]
pythonVersion = '3.10'
venvPath = ''
venv = ''

[tool.ruff]
line-length = 120

[tool.pytest.ini_options]
addopts = "-n 48 --dist loadfile"
markers = [
    "requires_snowflake: Mark a test as requiring a Snowflake connection.",
    "enterprise: Mark a test that only works on Enterprise Edition Snowflake.",
    "standard: Mark a test that works on Standard Edition Snowflake.",
    "slow: Mark a test that is slow to run but should still be executed.",
]
filterwarnings = [
    "ignore:.*urllib3.contrib.pyopenssl.*:DeprecationWarning"
]

[tool.codespell]
# codespell reads these as comma-separated strings; a TOML array is silently ignored.
# "objec" and "selct" are deliberately malformed identifiers in parser and error-handling
# tests, and "unparseable" is an accepted variant spelling.
ignore-words-list = "priv,sproc,snowpark,pathspec,objec,selct,unparseable"
skip = "./build/,./dist/,./site/,./.git/,./.venv/,./.venv-test/,./*.egg-info/"