name: Run Tests

on:
  push:
    branches: [ main ]
    paths-ignore:
    - version.md
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
    - uses: actions/checkout@v5
    - name: Install uv
      uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      with:
        python-version: ${{ matrix.python-version }}
        enable-cache: true
    - name: Install dependencies
      run: uv sync --locked
    - name: Run checks (linter, code style, static type checks, tests)
      run: |
        make lint
        make typecheck
        uv run pytest --ignore=tests/integration --cov=snowcap --cov-report=xml
    - name: Check the package builds
      # Catches packaging regressions (version regex, entry point, included files)
      # before a release: release-package.yml uploads straight to PyPI.
      run: |
        uv build
        uv run twine check dist/*
        uv run python - <<'EOF'
        import zipfile, glob
        wheel = zipfile.ZipFile(glob.glob("dist/snowcap-*.whl")[0])
        names = wheel.namelist()
        assert any(n.endswith("entry_points.txt") for n in names), "missing entry points"
        assert any("snowcap/templates/" in n for n in names), "missing templates"
        assert any(n.endswith("snowcap/py.typed") for n in names), "missing py.typed"
        EOF
    - name: Upload coverage reports to Codecov
      # v6 is the first release that pins a Node 24 build of actions/github-script;
      # v5 pins v7.0.1, which GitHub now reports as a deprecated Node 20 action.
      uses: codecov/codecov-action@v6
      env:
        CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
