name: Reset test accounts

on:
  workflow_dispatch:
  workflow_call:
    secrets:
      TEST_SNOWFLAKE_ACCOUNT:
        required: true
      TEST_SNOWFLAKE_USER:
        required: true
      TEST_SNOWFLAKE_PASSWORD:
        required: true
      VAR_STORAGE_BASE_URL:
        required: true
      VAR_STORAGE_ROLE_ARN:
        required: true
      VAR_STORAGE_AWS_EXTERNAL_ID:
        required: true
      STATIC_USER_RSA_PUBLIC_KEY:
        required: true
      STATIC_USER_MFA_PASSWORD:
        required: true

jobs:
  reset-test-accounts:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - environment: snowflake-azure-standard
          - environment: snowflake-gcp-standard
          - environment: snowflake-aws-standard
          - environment: snowflake-aws-enterprise
          - environment: snowflake-aws-business-critical
    environment: ${{ matrix.environment }}
    steps:
      - name: actions/checkout
        uses: actions/checkout@v5
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked
      - name: Reset test account
        run: |
          uv run python tools/manage_test_account.py teardown-and-reset
        env:
          SNOWFLAKE_ACCOUNT: ${{ secrets.TEST_SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_USER: ${{ secrets.TEST_SNOWFLAKE_USER }}
          SNOWFLAKE_PASSWORD: ${{ secrets.TEST_SNOWFLAKE_PASSWORD }}
          SNOWFLAKE_ROLE: ACCOUNTADMIN
          SNOWCAP_VAR_STORAGE_BASE_URL: ${{ secrets.VAR_STORAGE_BASE_URL }}
          SNOWCAP_VAR_STORAGE_ROLE_ARN: ${{ secrets.VAR_STORAGE_ROLE_ARN }}
          SNOWCAP_VAR_STORAGE_AWS_EXTERNAL_ID: ${{ secrets.VAR_STORAGE_AWS_EXTERNAL_ID }}
          SNOWCAP_VAR_STATIC_USER_RSA_PUBLIC_KEY: ${{ secrets.STATIC_USER_RSA_PUBLIC_KEY }}
          SNOWCAP_VAR_STATIC_USER_MFA_PASSWORD: ${{ secrets.STATIC_USER_MFA_PASSWORD }}